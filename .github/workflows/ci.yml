name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: "tests (the two slow end-to-end chain tests need ~20 GB peak and run locally)"
        run: cargo test --release
      - name: "verify every lemma (quick mode)"
        run: cargo run --release --bin verify -- --quick
      - name: "cost model reproduces the committed headline rows"
        run: cargo build --release --bin cost && python3 scripts/check_bench.py
