name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tests (including the end-to-end chain)
        run: cargo test --release -- --include-ignored
      - name: verify every lemma
        run: cargo run --release --bin verify
      - name: cost model (faithful + small search)
        run: CMAX=6 DMAX=250 cargo run --release --bin cost
