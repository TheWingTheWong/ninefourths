name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: "tests (including the end-to-end chain)"
        run: cargo test --release -- --include-ignored
      - name: "verify every lemma (quick mode; the ignored test covers the 2x2 chain)"
        run: cargo run --release --bin verify -- --quick
      - name: "cost model reproduces the committed headline rows"
        run: cargo build --release --bin cost && python3 scripts/check_bench.py
